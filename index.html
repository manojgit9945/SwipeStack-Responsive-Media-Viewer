<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SwipeStack: Responsive Media Viewer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(to right, #3a7bd5, #3a6073);
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
      color: white;
    }

    .page-title {
      color: white;
      font-size: 28px;
      margin-bottom: 20px;
      text-align: center;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.2);
    }

    .hint {
      position: fixed;
      top: 60%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 18px;
      opacity: 0.7;
      pointer-events: none;
      transition: opacity 0.3s;
      text-align: center;
      background: rgba(0,0,0,0.3);
      padding: 8px 16px;
      border-radius: 20px;
    }

    .card-stack {
      width: 90%;
      max-width: 350px;
      height: 75%;
      position: relative;
      perspective: 1000px;
      will-change: transform;
    }

    .card {
      position: absolute;
      width: 100%;
      height: 100%;
      background: #222;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
      transition: transform 0.4s cubic-bezier(0.23, 1, 0.32, 1),
                  opacity 0.4s cubic-bezier(0.23, 1, 0.32, 1);
      cursor: grab;
      overflow: hidden;
      transform-origin: center;
      will-change: transform, opacity;
      visibility: hidden;
      opacity: 0;
    }

    .card.visible {
      visibility: visible;
      opacity: 1;
    }

    .card.loading {
      background: #333;
    }

    .loader {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 48px;
      height: 48px;
      display: none;
      z-index: 2;
    }

    .card.loading .loader {
      display: block;
    }

    .loader::after {
      content: '';
      width: 48px;
      height: 48px;
      border: 3px solid #fff;
      border-bottom-color: transparent;
      border-radius: 50%;
      display: inline-block;
      box-sizing: border-box;
      animation: rotation 1s linear infinite;
    }

    @keyframes rotation {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    .card.preload-card {
      opacity: 0.1;
      background: #444;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      border-radius: 20px;
      transition: opacity 0.3s ease;
    }

    .card.loading img {
      opacity: 0;
    }

    .card.dragging {
      transition: none;
    }

    .card-info {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 15px;
      background: linear-gradient(to top, rgba(0,0,0,0.8), rgba(0,0,0,0));
      color: white;
      border-bottom-left-radius: 20px;
      border-bottom-right-radius: 20px;
    }

    .car-name {
      font-weight: bold;
      font-size: 18px;
      margin-bottom: 5px;
    }

    .car-details {
      font-size: 14px;
      opacity: 0.8;
    }

    .loading-progress {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-size: 14px;
      background: rgba(0, 0, 0, 0.5);
      padding: 4px 12px;
      border-radius: 12px;
      display: none;
      z-index: 2;
    }

    .card.loading .loading-progress {
      display: block;
    }

    .controls {
      margin-top: 20px;
      display: flex;
      gap: 10px;
    }

    .btn {
      background: rgba(255,255,255,0.2);
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn:hover {
      background: rgba(255,255,255,0.3);
    }

    @media (max-width: 600px) {
      .card-stack {
        max-width: 90%;
        height: 65%;
      }
      .card {
        border-radius: 15px;
      }
      .hint {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <h1 class="page-title">SwipeStack: Responsive Media Viewer</h1>
  <div class="hint">← Swipe cards → or use buttons below</div>
  <div class="card-stack" id="cardStack"></div>
  
  <div class="controls">
    <button class="btn" id="prevBtn">Previous</button>
    <button class="btn" id="reloadBtn">Load More</button>
    <button class="btn" id="nextBtn">Next</button>
  </div>
  
  <div id="apiStatus" style="margin-top: 15px; font-size: 14px; opacity: 0.7; text-align: center; background: rgba(0,0,0,0.2); padding: 8px; border-radius: 15px;">
    Using multiple APIs: Unsplash, Pixabay, and Lorem Picsum
  </div>

  <script>
    // Configuration
    const PRELOAD_RANGE = 2;
    const VISIBLE_RANGE = 3;
    const INITIAL_CARD_COUNT = 20;
    
    // Car brands and models for random generation
    const CAR_BRANDS = [
      "Ferrari", "Lamborghini", "Porsche", "McLaren", "Bugatti", "Aston Martin",
      "BMW", "Mercedes-Benz", "Audi", "Toyota", "Honda", "Ford", "Chevrolet",
      "Nissan", "Tesla", "Jaguar", "Lexus", "Maserati", "Bentley", "Rolls-Royce"
    ];
    
    const CAR_MODELS = {
      "Ferrari": ["F8 Tributo", "812 Superfast", "Roma", "SF90 Stradale", "Portofino"],
      "Lamborghini": ["Aventador", "Huracán", "Urus", "Sián", "Revuelto"],
      "Porsche": ["911", "Taycan", "Panamera", "Cayenne", "Macan"],
      "McLaren": ["720S", "Artura", "GT", "Elva", "Speedtail"],
      "Bugatti": ["Chiron", "Veyron", "Divo", "La Voiture Noire", "Centodieci"],
      "Aston Martin": ["DB11", "Vantage", "DBS Superleggera", "Valkyrie", "DBX"],
      "BMW": ["M3", "M5", "X5", "i8", "8 Series"],
      "Mercedes-Benz": ["S-Class", "E-Class", "G-Wagon", "AMG GT", "EQS"],
      "Audi": ["R8", "RS6", "Q8", "e-tron GT", "A8"],
      "Toyota": ["Supra", "GR Yaris", "Land Cruiser", "Century", "Crown"],
      "Honda": ["NSX", "Civic Type R", "S2000", "Prelude", "Integra"],
      "Ford": ["Mustang", "GT", "Raptor", "Bronco", "Shelby GT500"],
      "Chevrolet": ["Corvette", "Camaro", "Silverado", "Suburban", "Tahoe"],
      "Nissan": ["GT-R", "Z", "Skyline", "Ariya", "Patrol"],
      "Tesla": ["Model S", "Model 3", "Model X", "Model Y", "Cybertruck"],
      "Jaguar": ["F-Type", "I-Pace", "XJ", "F-Pace", "XF"],
      "Lexus": ["LFA", "LC 500", "LS", "RX", "IS"],
      "Maserati": ["MC20", "Ghibli", "Levante", "Quattroporte", "GranTurismo"],
      "Bentley": ["Continental GT", "Bentayga", "Flying Spur", "Bacalar", "Mulliner"],
      "Rolls-Royce": ["Phantom", "Ghost", "Cullinan", "Wraith", "Dawn"]
    };
    
    // Car years range
    const MIN_YEAR = 2018;
    const MAX_YEAR = 2025;
    
    // Image dimensions for Unsplash API
    const WIDTH = 800;
    const HEIGHT = 600;
    
    class MediaLoader {
      constructor() {
        this.loadQueue = new Set();
        this.loading = new Set();
        this.loaded = new Set();
        this.maxConcurrent = 3;
      }

      addToQueue(card) {
        if (this.loaded.has(card) || this.loading.has(card) || this.loadQueue.has(card)) return;
        this.loadQueue.add(card);
        this.processQueue();
      }

      processQueue() {
        if (this.loading.size >= this.maxConcurrent) return;
        
        for (const card of this.loadQueue) {
          if (this.loading.size >= this.maxConcurrent) break;
          
          this.loadQueue.delete(card);
          this.loading.add(card);
          
          const img = card.querySelector('img');
          if (!img || !img.dataset.src) {
            this.loading.delete(card);
            continue;
          }

          // Create and update progress display
          let progress = card.querySelector('.loading-progress');
          if (!progress) {
            progress = document.createElement('div');
            progress.className = 'loading-progress';
            card.appendChild(progress);
          }
          progress.textContent = 'Loading...';

          img.onload = () => this.handleLoad(card);
          img.onerror = () => this.handleError(card);
          img.src = img.dataset.src;
          delete img.dataset.src;
        }
      }

      handleLoad(card) {
        this.loading.delete(card);
        this.loaded.add(card);
        card.classList.remove('loading');
        const progress = card.querySelector('.loading-progress');
        if (progress) {
          progress.remove();
        }
        this.processQueue();
      }

      handleError(card) {
        this.loading.delete(card);
        
        // Try with a different image source on error
        const img = card.querySelector('img');
        const car = JSON.parse(card.dataset.car);
        
        // If it's a Pixabay JSON response that failed to load as an image
        if (img.src.includes('pixabay.com/api')) {
          // Fetch the actual image from the Pixabay API response
          fetch(img.src)
            .then(response => response.json())
            .then(data => {
              if (data && data.hits && data.hits.length > 0) {
                img.src = data.hits[0].webformatURL;
              } else {
                // Fallback to Picsum if no results
                img.src = `https://picsum.photos/${WIDTH}/${HEIGHT}?random=${Math.random()}`;
              }
            })
            .catch(() => {
              // Ultimate fallback
              img.src = '/api/placeholder/800/600';
            });
        } else {
          // Try with Lorem Picsum as a reliable fallback
          img.src = `https://picsum.photos/${WIDTH}/${HEIGHT}?random=${Math.random()}`;
        }
        
        const progress = card.querySelector('.loading-progress');
        if (progress) {
          progress.textContent = 'Trying alternate source...';
          setTimeout(() => {
            if (card.contains(progress)) {
              progress.remove();
            }
          }, 2000);
        }
        
        // Don't mark as loaded until the fallback completes successfully
        img.onload = () => {
          card.classList.remove('loading');
          this.loaded.add(card);
          this.processQueue();
        };
      }

      prioritize(cards) {
        for (const card of this.loadQueue) {
          if (!cards.includes(card)) {
            this.loadQueue.delete(card);
          }
        }
        cards.forEach(card => this.addToQueue(card));
      }
    }

    const mediaLoader = new MediaLoader();
    
    // Generate random car data
    function generateRandomCar() {
      const brand = CAR_BRANDS[Math.floor(Math.random() * CAR_BRANDS.length)];
      const model = CAR_MODELS[brand][Math.floor(Math.random() * CAR_MODELS[brand].length)];
      const year = Math.floor(Math.random() * (MAX_YEAR - MIN_YEAR + 1)) + MIN_YEAR;
      
      // Generate a query that will likely return a car image
      const searchTerm = `${year} ${brand} ${model}`;
      
      return {
        brand,
        model,
        year,
        searchTerm
      };
    }
    
    // Get image URL from multiple sources for a car
    function getCarImageUrl(car) {
      // Use multiple APIs to get car images
      const apis = [
        // Unsplash Source API
        `https://source.unsplash.com/random/${WIDTH}x${HEIGHT}/?${encodeURIComponent(car.searchTerm)}`,
        
        // Pixabay API (doesn't require authentication for this endpoint)
        `https://pixabay.com/api/?key=pixabay_api_demo&q=${encodeURIComponent(car.searchTerm)}&image_type=photo&orientation=horizontal&min_width=${WIDTH}&min_height=${HEIGHT}&per_page=3`,
        
        // Use Lorem Picsum as a reliable fallback for random images
        `https://picsum.photos/${WIDTH}/${HEIGHT}?random=${Math.random()}`
      ];
      
      // Select API randomly for variety and to distribute load
      return apis[Math.floor(Math.random() * apis.length)];
    }
    
    const cardStack = document.getElementById('cardStack');
    const cards = [];
    let currentIndex = 0;
    
    // Function to safely retry with a different API if one fails
    function switchImageAPI(img, car) {
      // Try a different API method
      const methods = [
        // Direct Unsplash method
        `https://source.unsplash.com/random/${WIDTH}x${HEIGHT}/?${encodeURIComponent(car.searchTerm)}`,
        
        // Direct Lorem Picsum method (completely reliable fallback)
        `https://picsum.photos/${WIDTH}/${HEIGHT}?random=${Math.random()}`
      ];
      
      // Pick a method we haven't tried yet
      const usedMethod = img.dataset.usedMethod || 0;
      const newMethod = (parseInt(usedMethod) + 1) % methods.length;
      img.dataset.usedMethod = newMethod;
      
      return methods[newMethod];
    }
    
    // Create initial set of cards
    function createCards(count) {
      for (let i = 0; i < count; i++) {
        const car = generateRandomCar();
        const card = document.createElement('div');
        card.className = 'card loading';
        card.dataset.car = JSON.stringify(car);
        
        // Add loader spinner
        const loader = document.createElement('div');
        loader.className = 'loader';
        card.appendChild(loader);
        
        // Create image element
        const img = document.createElement('img');
        img.alt = `Car image`;
        img.dataset.src = getCarImageUrl(car);
        img.dataset.usedMethod = "0"; // Track which API we've tried
        
        // Add backup error handler before initial load
        img.onerror = function() {
          this.src = switchImageAPI(this, car);
        };
        
        card.appendChild(img);
        
        cardStack.appendChild(card);
        cards.push(card);
      }
      
      updateCardsPosition();
    }
    
    // Add more cards
    function addMoreCards(count) {
      const startIndex = cards.length;
      createCards(count);
      return startIndex;
    }
    
    let startX = 0;
    let currentX = 0;
    let isDragging = false;
    let animationFrame = null;
    
    const updateCardsPosition = (offset = 0) => {
      if (animationFrame) {
        cancelAnimationFrame(animationFrame);
      }
      
      animationFrame = requestAnimationFrame(() => {
        const start = Math.max(0, currentIndex - VISIBLE_RANGE);
        const end = Math.min(cards.length, currentIndex + VISIBLE_RANGE + 1);
        const preloadStart = Math.max(0, currentIndex - PRELOAD_RANGE);
        const preloadEnd = Math.min(cards.length, currentIndex + PRELOAD_RANGE + 1);
        
        const priorityCards = cards.slice(preloadStart, preloadEnd);
        mediaLoader.prioritize(priorityCards);
        
        cards.forEach((card, index) => {
          if (index < start || index > end) {
            card.style.visibility = 'hidden';
            card.classList.remove('visible');
            return;
          }
          
          const distance = index - currentIndex;
          let x = 0;
          let scale = 1;
          let rotation = 0;
          let zIndex = cards.length - Math.abs(distance);
          
          if (distance === 0) {
            x = offset;
            scale = 1;
            rotation = offset * 0.05;
          } else if (distance > 0) {
            x = 40 + (distance - 1) * 10;
            scale = 0.95 - (distance - 1) * 0.05;
            rotation = 3;
          } else {
            x = -40 + (distance + 1) * 10;
            scale = 0.95 + (distance + 1) * 0.05;
            rotation = -3;
          }
          
          card.style.visibility = 'visible';
          card.style.transform = `translateX(${x}px) scale(${scale}) rotate(${rotation}deg)`;
          card.style.zIndex = zIndex;
          card.classList.add('visible');
        });
      });
    };
    
    let lastDragTime = 0;
    const dragThrottle = 16;
    
    const handleStart = (e) => {
      if (currentIndex < 0 || currentIndex >= cards.length) return;
      isDragging = true;
      startX = e.type === 'mousedown' ? e.clientX : e.touches[0].clientX;
      currentX = startX;
      
      cards[currentIndex].classList.add('dragging');
      document.querySelector('.hint').style.opacity = '0';
    };
    
    const handleMove = (e) => {
      if (!isDragging) return;
      e.preventDefault();
      
      const now = Date.now();
      if (now - lastDragTime < dragThrottle) return;
      
      lastDragTime = now;
      currentX = e.type === 'mousemove' ? e.clientX : e.touches[0].clientX;
      const diff = currentX - startX;
      
      updateCardsPosition(diff);
    };
    
    const handleEnd = () => {
      if (!isDragging) return;
      isDragging = false;
      
      const currentCard = cards[currentIndex];
      currentCard.classList.remove('dragging');
      
      const diff = currentX - startX;
      const threshold = 100;
      
      if (Math.abs(diff) > threshold) {
        currentIndex += diff > 0 ? -1 : 1;
        currentIndex = Math.max(0, Math.min(currentIndex, cards.length - 1));
        
        // If nearing the end, add more cards
        if (currentIndex >= cards.length - 5) {
          addMoreCards(10);
        }
      }
      
      updateCardsPosition(0);
    };
    
    // Navigation buttons
    document.getElementById('prevBtn').addEventListener('click', () => {
      if (currentIndex > 0) {
        currentIndex--;
        updateCardsPosition(0);
      }
    });
    
    document.getElementById('nextBtn').addEventListener('click', () => {
      if (currentIndex < cards.length - 1) {
        currentIndex++;
        updateCardsPosition(0);
        
        // If nearing the end, add more cards
        if (currentIndex >= cards.length - 5) {
          addMoreCards(10);
        }
      }
    });
    
    document.getElementById('reloadBtn').addEventListener('click', () => {
      const newIndex = addMoreCards(10);
      currentIndex = newIndex;
      updateCardsPosition(0);
    });
    
    // Event listeners for dragging
    cardStack.addEventListener('mousedown', handleStart, { passive: true });
    cardStack.addEventListener('mousemove', handleMove);
    cardStack.addEventListener('mouseup', handleEnd);
    cardStack.addEventListener('mouseleave', handleEnd);
    cardStack.addEventListener('touchstart', handleStart, { passive: true });
    cardStack.addEventListener('touchmove', handleMove);
    cardStack.addEventListener('touchend', handleEnd);
    
    // Initialize
    createCards(INITIAL_CARD_COUNT);
  </script>
</body>
</html>
