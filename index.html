<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=0.85, maximum-scale=0.85, user-scalable=no">

  <title>SwipeStack: Responsive Media Viewer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(to right, #3a7bd5, #3a6073);
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
      color: white;
    }

    .page-title {
      color: white;
      font-size: 28px;
      margin-bottom: 20px;
      text-align: center;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.2);
    }

    .hint {
      position: fixed;
      top: 60%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 18px;
      opacity: 0.7;
      pointer-events: none;
      transition: opacity 0.3s;
      text-align: center;
      background: rgba(0,0,0,0.3);
      padding: 8px 16px;
      border-radius: 20px;
      z-index: 1000;
    }

    .card-stack {
      width: 90%;
      max-width: 350px;
      height: 75%;
      position: relative;
      perspective: 1000px;
      will-change: transform;
    }

    .card {
      position: absolute;
      width: 100%;
      height: 100%;
      background: #222;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
      transition: transform 0.4s cubic-bezier(0.23, 1, 0.32, 1),
                  opacity 0.4s cubic-bezier(0.23, 1, 0.32, 1);
      cursor: grab;
      overflow: hidden;
      transform-origin: center;
      will-change: transform, opacity;
      visibility: hidden;
      opacity: 0;
    }

    .card.visible {
      visibility: visible;
      opacity: 1;
    }

    .card.loading {
      background: #333;
    }

    .loader {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 48px;
      height: 48px;
      display: none;
      z-index: 2;
    }

    .card.loading .loader {
      display: block;
    }

    .loader::after {
      content: '';
      width: 48px;
      height: 48px;
      border: 3px solid #fff;
      border-bottom-color: transparent;
      border-radius: 50%;
      display: inline-block;
      box-sizing: border-box;
      animation: rotation 1s linear infinite;
    }

    @keyframes rotation {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    .card.preload-card {
      opacity: 0.1;
      background: #444;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      border-radius: 20px;
      transition: opacity 0.3s ease;
    }

    .card.loading img {
      opacity: 0;
    }

    .card.dragging {
      transition: none;
    }

    .card-info {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 10px 15px;  
      background: linear-gradient(to top, rgba(0,0,0,0.8), rgba(0,0,0,0));
      color: white;
      border-bottom-left-radius: 20px;
      border-bottom-right-radius: 20px;
      text-align: center;  
    }
    
    .item-name {
      font-weight: bold;
      font-size: 18px;
      margin-bottom: 5px;
    }

    .item-details {
      font-size: 16px;  
      opacity: 0.9;     
      font-weight: 500; 
    }
    
    .api-source {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0,0,0,0.6);
      color: white;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
      z-index: 10;
    }
    
    .loading-progress {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-size: 14px;
      background: rgba(0, 0, 0, 0.5);
      padding: 4px 12px;
      border-radius: 12px;
      display: none;
      z-index: 2;
    }

    .card.loading .loading-progress {
      display: block;
    }

    .controls {
      margin-top: 20px;
      display: flex;
      gap: 10px;
    }

    .btn {
      background: rgba(255,255,255,0.2);
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn:hover {
      background: rgba(255,255,255,0.3);
    }

    @media (max-width: 600px) {
      .card-stack {
        max-width: 90%;
        height: 65%;
      }
      .card {
        border-radius: 15px;
      }
      .hint {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <h1 class="page-title">SwipeStack: Responsive Media Viewer</h1>
  <div class="hint">← Swipe cards → or use buttons below</div>
  <div class="card-stack" id="cardStack"></div>
  
  <div class="controls">
    <button class="btn" id="prevBtn">Previous</button>
    <button class="btn" id="reloadBtn">Load More</button>
    <button class="btn" id="nextBtn">Next</button>
  </div>
  
  <div id="apiStatus" style="margin-top: 15px; font-size: 14px; opacity: 0.7; text-align: center; background: rgba(0,0,0,0.2); padding: 8px; border-radius: 15px;">
    Using multiple API sources for maximum reliability
  </div>

<script>
  const WIDTH = 1920;
  const HEIGHT = 1080;
  const INITIAL_CARD_COUNT = 20;
  const PRELOAD_RANGE = 2;
  const VISIBLE_RANGE = 3;
  const USED_URLS = new Set();

  const SEARCH_TOPICS = [
    "nature", "cinema", "space", "technology", "architecture",
    "fantasy", "mythology", "abstract", "ocean", "travel",
    "landscape", "art", "galaxy", "urban", "vintage",
    "wildlife", "dreamscape", "sci-fi", "mountains", "sunset",
    "surrealism", "minimalist", "cyberpunk", "historical", "future"
  ];

  // API source configurations with names for display
  const API_SOURCES = [
    {
      name: "Unsplash",
      url: `https://source.unsplash.com/random/${WIDTH}x${HEIGHT}/?{query}`,
      type: "direct"
    },
    {
      name: "Random.ImageCDN",
      url: `https://random.imagecdn.app/${WIDTH}/${HEIGHT}`,
      type: "direct"
    },
    {
      name: "Picsum Photos",
      url: `https://picsum.photos/${WIDTH}/${HEIGHT}?random={rand}`,
      type: "direct"
    },
    {
      name: "Pexels API",
      type: "pexels"
    }
  ];

  // Add the authorization header with your Pexels API key
  async function getPexelsImage(query) {
    try {
      const apiKey = "XXqDuusTgtQEwHvbO0JbuNRRWgMBnncTwbRfEWt8gE7VqjNEllez2AgX"; // Replace with actual key
      const response = await fetch(`https://api.pexels.com/v1/search?query=${query}&per_page=1&page=${Math.floor(Math.random() * 20) + 1}`, {
        headers: {
          Authorization: apiKey
        }
      });
      
      if (!response.ok) {
        throw new Error("Pexels API error");
      }

      const data = await response.json();
      if (data.photos && data.photos.length > 0) {
        return { url: data.photos[0].src.large2x, source: "Pexels API" };
      }
      throw new Error("No images found");
    } catch (error) {
      console.error("Pexels API error:", error);
      throw error;
    }
  }

  function generateRandomItem() {
    const year = Math.floor(Math.random() * (2025 - 2000 + 1)) + 2000;
    const query = SEARCH_TOPICS[Math.floor(Math.random() * SEARCH_TOPICS.length)];
    return { year, query };
  }

  // Function to cycle through API sources
  let lastApiIndex = -1;
  
  async function resolveImageUrl(item) {
    let attempts = 0;
    
    // Cycle through all APIs one by one
    while (attempts < API_SOURCES.length * 2) {
      lastApiIndex = (lastApiIndex + 1) % API_SOURCES.length;
      const apiSource = API_SOURCES[lastApiIndex];
      const rand = Math.floor(Math.random() * 100000);
      
      try {
        if (apiSource.type === "pexels") {
          // Use Pexels API
          const result = await getPexelsImage(item.query);
          if (!USED_URLS.has(result.url)) {
            USED_URLS.add(result.url);
            return { url: result.url, source: result.source };
          }
        } else {
          // Direct URL construction
          let url = apiSource.url
            .replace("{width}", WIDTH)
            .replace("{height}", HEIGHT)
            .replace("{query}", encodeURIComponent(item.query))
            .replace("{rand}", rand);
          
          if (!USED_URLS.has(url)) {
            USED_URLS.add(url);
            return { url, source: apiSource.name };
          }
        }
      } catch (error) {
        console.log(`Error with ${apiSource.name}:`, error);
      }
      
      attempts++;
    }

    // Fallback to Picsum Photos if all else fails
    const fallbackUrl = `https://picsum.photos/${WIDTH}/${HEIGHT}?fallback=${Date.now()}`;
    return { url: fallbackUrl, source: "Picsum (Fallback)" };
  }

  class MediaLoader {
    constructor() {
      this.queue = new Set();
      this.loading = new Set();
      this.loaded = new Set();
    }

    async loadCard(card) {
      const img = card.querySelector("img");
      const item = JSON.parse(card.dataset.item);
      card.classList.add("loading");
      
      try {
        const result = await resolveImageUrl(item);
        img.onload = () => this.onLoad(card, result.source);
        img.onerror = () => this.onError(card, item);
        img.src = result.url;
        card.dataset.source = result.source;
      } catch (error) {
        this.onError(card, item);
      }
    }

    onLoad(card, source) {
      this.loading.delete(card);
      this.loaded.add(card);
      card.classList.remove("loading");
      
      const progress = card.querySelector(".loading-progress");
      if (progress) progress.remove();
      
      // Show API source and info
      this.showInfo(card);
      this.showApiSource(card, source);

      // Smooth fade-in effect
      card.querySelector("img").style.opacity = 1;
    }

    onError(card, item) {
      this.loading.delete(card);
      card.classList.add("loading");
      
      // Try another source on error
      setTimeout(() => {
        resolveImageUrl(item).then(result => {
          const img = card.querySelector("img");
          img.src = result.url;
          card.dataset.source = result.source;
        });
      }, 500);
    }

    showInfo(card) {
      if (card.querySelector(".card-info")) return;
      const item = JSON.parse(card.dataset.item);
      const div = document.createElement("div");
      div.className = "card-info";
      div.innerHTML = `<div class="item-name">${item.query}</div>
                      <div class="item-details">${item.year}</div>`;
      card.appendChild(div);
    }
    
    showApiSource(card, source) {
      if (card.querySelector(".api-source")) return;
      const div = document.createElement("div");
      div.className = "api-source";
      div.textContent = source || card.dataset.source || "Unknown Source";
      card.appendChild(div);
    }

    prioritize(cards) {
      cards.forEach(card => {
        if (!this.loading.has(card) && !this.loaded.has(card)) {
          this.loading.add(card);
          this.loadCard(card);
        }
      });
    }
  }

  const mediaLoader = new MediaLoader();
  const cardStack = document.getElementById("cardStack");
  const cards = [];
  let currentIndex = 0;

  // Intersection Observer for lazy loading
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const card = entry.target;
        mediaLoader.loadCard(card);
        observer.unobserve(card);
      }
    });
  }, {
    rootMargin: '0px 0px 300px 0px',  // Trigger when image is close to view
  });

  function createCards(count) {
    for (let i = 0; i < count; i++) {
      const item = generateRandomItem();
      const card = document.createElement("div");
      card.className = "card loading";
      card.dataset.item = JSON.stringify(item);

      card.innerHTML = `
        <div class="loader"></div>
        <img alt="${item.query} image" style="opacity: 0;" />
        <div class="loading-progress">Loading...</div>
      `;

      cardStack.appendChild(card);
      cards.push(card);

      observer.observe(card);  // Start observing each card for lazy loading
    }

    updateCardsPosition();
  }

  function updateCardsPosition(offset = 0) {
    const start = Math.max(0, currentIndex - VISIBLE_RANGE);
    const end = Math.min(cards.length, currentIndex + VISIBLE_RANGE + 1);
    const preloadStart = Math.max(0, currentIndex - PRELOAD_RANGE);
    const preloadEnd = Math.min(cards.length, currentIndex + PRELOAD_RANGE * 2);

    const preload = cards.slice(preloadStart, preloadEnd);
    mediaLoader.prioritize(preload);

    cards.forEach((card, index) => {
      if (index < start || index > end) {
        card.style.visibility = "hidden";
        card.classList.remove("visible");
        return;
      }

      const distance = index - currentIndex;
      let x = 0, scale = 1, rotation = 0;
      let zIndex = cards.length - Math.abs(distance);

      if (distance === 0) {
        x = offset;
        rotation = offset * 0.05;
      } else if (distance > 0) {
        x = 40 + (distance - 1) * 10;
        scale = 0.95 - (distance - 1) * 0.05;
        rotation = 3;
      } else {
        x = -40 + (distance + 1) * 10;
        scale = 0.95 + (distance + 1) * 0.05;
        rotation = -3;
      }

      card.style.visibility = "visible";
      card.style.transform = `translateX(${x}px) scale(${scale}) rotate(${rotation}deg)`;
      card.style.zIndex = zIndex;
      card.classList.add("visible");
    });
  }

  // Swipe logic
  let startX = 0, currentX = 0, isDragging = false;
  const hint = document.querySelector(".hint");

  function handleStart(e) {
    isDragging = true;
    startX = e.touches ? e.touches[0].clientX : e.clientX;
    hint.style.opacity = "0";
  }

  function handleMove(e) {
    if (!isDragging) return;
    currentX = e.touches ? e.touches[0].clientX : e.clientX;
    const offset = currentX - startX;
    updateCardsPosition(offset);
  }

  function handleEnd() {
    if (!isDragging) return;
    isDragging = false;
    const offset = currentX - startX;
    const threshold = window.innerWidth * 0.15;

    if (Math.abs(offset) > threshold) {
      currentIndex += offset < 0 ? 1 : -1;
      currentIndex = Math.max(0, Math.min(cards.length - 1, currentIndex));
      if (currentIndex >= cards.length - 5) createCards(10);
    }

    updateCardsPosition();
  }

  cardStack.addEventListener("mousedown", handleStart);
  cardStack.addEventListener("touchstart", handleStart, { passive: true });
  window.addEventListener("mousemove", handleMove);
  window.addEventListener("touchmove", handleMove);
  window.addEventListener("mouseup", handleEnd);
  window.addEventListener("touchend", handleEnd);

  // Buttons
  document.getElementById("prevBtn").addEventListener("click", () => {
    if (currentIndex > 0) currentIndex--;
    updateCardsPosition();
  });

  document.getElementById("nextBtn").addEventListener("click", () => {
    if (currentIndex < cards.length - 1) {
      currentIndex++;
      if (currentIndex >= cards.length - 5) createCards(10);
    }
    updateCardsPosition();
  });

  document.getElementById("reloadBtn").addEventListener("click", () => {
    const newIndex = cards.length;
    createCards(10);
    currentIndex = newIndex;
    updateCardsPosition();
  });

  // Update API status text
  setInterval(() => {
    const apiStatus = document.getElementById("apiStatus");
    const activeSources = API_SOURCES.map(s => s.name).join(", ");
    apiStatus.textContent = `Active sources: ${activeSources}`;
  }, 5000);

  createCards(INITIAL_CARD_COUNT);
</script>

</body>
</html>
